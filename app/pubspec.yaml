name: gudory
description: "GUDORY (구도리) - composition coaching camera for InThon 2026"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  audioplayers: ^6.8.1
  camera: ^0.12.2
  connectivity_plus: ^7.3.2
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_tts: ^4.2.5
  gal: ^2.3.3
  go_router: ^18.1.2
  google_mlkit_pose_detection: ^0.16.1
  google_mlkit_selfie_segmentation: ^0.12.1
  http: ^1.6.0
  image: ^4.12.0
  image_picker: ^1.2.4
  onnxruntime: ^1.4.1
  path_provider: ^2.1.6
  sensors_plus: ^7.1.1
  sqflite: ^2.4.5
  vibration: ^3.2.1
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/recommend.json
    - assets/clip/
    - assets/demo/
    - assets/sounds/
